<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>危機診斷室 - 口傳發言人的學習小天地</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; scroll-behavior: smooth; }
        .apa-hover { opacity: 0; transition: opacity 0.3s; }
        .case-card:hover .apa-hover { opacity: 1; }
        .diag-btn { transition: all 0.2s; }
        .diag-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 p-6 md:p-12 text-slate-800">

    <header class="max-w-5xl mx-auto text-center mb-16">
        <h1 class="text-4xl font-extrabold text-slate-900 mb-4">🏥 危機診斷室</h1>
        <p class="text-xl text-slate-500 italic font-light">案例固定，邏輯串接診斷</p>
        <div class="mt-6 h-1 w-24 bg-blue-600 mx-auto rounded-full"></div>
    </header>

    <main class="max-w-5xl mx-auto space-y-12">
        <h2 class="text-2xl font-bold mb-8 flex items-center tracking-wide">📁 臨床病例：請學生進行三階診斷</h2>

        <div class="case-card bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-8 border-b border-slate-100 bg-slate-50/50">
                <h3 class="text-2xl font-bold text-blue-900 mb-2 font-serif">病例一：餐飲名店異物衝擊 (林聰明模式)</h3>
                <p class="text-slate-600 leading-relaxed">網友於社群爆料影片顯示餐點內有大型蟑螂，視覺衝擊力強，迅速引發大量轉發與負面評論。</p>
            </div>
            <div class="p-8 grid md:grid-cols-3 gap-4">
                <button onclick="showDiag('case1', 'stage')" class="diag-btn p-4 bg-blue-600 text-white rounded-xl font-bold">第一階：時效診斷</button>
                <button onclick="showDiag('case1', 'scct')" class="diag-btn p-4 bg-green-600 text-white rounded-xl font-bold">第二階：責任歸因</button>
                <button onclick="showDiag('case1', 'restoration')" class="diag-btn p-4 bg-purple-600 text-white rounded-xl font-bold">第三階：修辭策略</button>
            </div>
            <div id="case1-result" class="px-8 pb-8 hidden animate-fade-in text-slate-700 leading-loose"></div>
        </div>

        <div class="case-card bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-8 border-b border-slate-100 bg-slate-50/50">
                <h3 class="text-2xl font-bold text-red-900 mb-2 font-serif">病例二：公衛危機與數位極化 (台北老鼠模式)</h3>
                <p class="text-slate-600 leading-relaxed">民間製作「見鼠地圖」視覺化公共衛生問題，政治攻防介入，演算法推動同溫層產生高度對立。</p>
            </div>
            <div class="p-8 grid md:grid-cols-3 gap-4">
                <button onclick="showDiag('case2', 'stage')" class="diag-btn p-4 bg-blue-600 text-white rounded-xl font-bold">第一階：時效診斷</button>
                <button onclick="showDiag('case2', 'scct')" class="diag-btn p-4 bg-green-600 text-white rounded-xl font-bold">第二階：責任歸因</button>
                <button onclick="showDiag('case2', 'restoration')" class="diag-btn p-4 bg-purple-600 text-white rounded-xl font-bold">第三階：修辭策略</button>
            </div>
            <div id="case2-result" class="px-8 pb-8 hidden text-slate-700 leading-loose"></div>
        </div>

        <div class="case-card bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-8 border-b border-slate-100 bg-slate-50/50">
                <h3 class="text-2xl font-bold text-amber-900 mb-2 font-serif">病例三：公部門系統性失靈</h3>
                <p class="text-slate-600 leading-relaxed">公部門內部管理疏失導致系統崩潰，影響市民個資安全。初期內部已知情卻未通報，直至被駭客勒索才曝光。</p>
            </div>
            <div class="p-8 grid md:grid-cols-3 gap-4">
                <button onclick="showDiag('case3', 'stage')" class="diag-btn p-4 bg-blue-600 text-white rounded-xl font-bold">第一階：時效診斷</button>
                <button onclick="showDiag('case3', 'scct')" class="diag-btn p-4 bg-green-600 text-white rounded-xl font-bold">第二階：責任歸因</button>
                <button onclick="showDiag('case3', 'restoration')" class="diag-btn p-4 bg-purple-600 text-white rounded-xl font-bold">第三階：修辭策略</button>
            </div>
            <div id="case3-result" class="px-8 pb-8 hidden text-slate-700 leading-loose"></div>
        </div>
    </main>

    <footer class="mt-24 py-12 border-t border-slate-200 text-center text-slate-400 text-xs">
        <p>© 2026 危機診斷室｜專業分析・學術嚴謹・APA 7th 規範 [Coombs, 2019; Benoit, 1995]</p>
    </footer>

    <script>
        const diagData = {
            case1: {
                stage: "🕒 <strong>時效診斷 (爆發期)：</strong> 影片造成立即性衝擊，屬於「爆發期」。發言人需搶在演算法擴散前，進行高透明度的資訊揭露。",
                scct: "⚖️ <strong>責任歸因 (可預防型)：</strong> 食安屬內部管理範疇，公眾責任感極重。此時任何規避行為都會引發品牌毀滅。",
                restoration: "🔪 <strong>修辭策略 (修正行動)：</strong> 以全店停業兩天換取信任，這是 Benoit 的最高強度修正，透過實質損失表達誠信。"
            },
            case2: {
                stage: "🕒 <strong>時效診斷 (預警期轉爆發期)：</strong> 從零星抱怨到「地圖化」呈現。一旦進入議題設定階段，發言人必須處理公眾的感官事實。",
                scct: "⚖️ <strong>責任歸因 (意外型轉政治化)：</strong> 雖然老鼠具隨機性，但當議題被標籤化，政府將面臨「行政怠惰」的壓力，責任感隨極化加重。",
                restoration: "🔪 <strong>修辭策略 (強化優點)：</strong> 引入第三方中立數據與專家背書 (Bolstering)，嘗試將議題從政治口水拉回科學治理。"
            },
            case3: {
                stage: "🕒 <strong>時效診斷 (恢復期診斷)：</strong> 事後才曝光代表已錯失爆發期的主動權。現在重點在於「修補」與「防堵」。",
                scct: "⚖️ <strong>責任歸因 (可預防型/雙重責任)：</strong> 內部管理不善加隱匿不報，公眾憤怒值最高。組織面臨道德與法律雙重指責。",
                restoration: "🔪 <strong>修辭策略 (致歉與修正)：</strong> 除正式致歉外，必須公開技術查核報告與長期資安升級計畫，避免再次發生。"
            }
        };

        function showDiag(caseId, diagType) {
            const resultEl = document.getElementById(`${caseId}-result`);
            resultEl.innerHTML = `
                <div class="p-6 bg-slate-50 rounded-2xl border border-slate-200 shadow-inner">
                    ${diagData[caseId][diagType]}
                    <div class="mt-4 text-[10px] text-slate-400 italic">學術參考：${getRef(diagType)}</div>
                </div>
            `;
            resultEl.classList.remove('hidden');
        }

        function getRef(type) {
            if (type === 'stage') return "Coombs, W. T. (2019). Ongoing crisis communication.";
            if (type === 'scct') return "Coombs, W. T. (2007). Corporate Reputation Review.";
            return "Benoit, W. L. (1995). Image restoration strategies.";
        }
    </script>
</body>
</html>
